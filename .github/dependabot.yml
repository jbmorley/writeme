version: 2

updates:

  - package-ecosystem: "pip"
    directories:
      - "/client"
      - "/service/tests"
      - "/service/web"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/service/web"
    schedule:
      interval: "weekly"
